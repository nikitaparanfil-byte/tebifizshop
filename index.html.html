<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEBIFIZSHOP — Лучший шоп по продаже физов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070d09;
            --card-bg: rgba(15, 28, 20, 0.75);
            --dollar-green: #18a558;
            --dollar-light: #2ecc71;
            --gold: #f1c40f;
            --gold-gradient: linear-gradient(135deg, #fceabb 0%, #f8b500 50%, #d4af37 100%);
            --green-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --text-main: #ffffff;
            --text-muted: #b0c4b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(24, 165, 88, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(241, 196, 15, 0.12) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Декоративная сетка на фоне */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--card-bg);
            border: 1px solid rgba(241, 196, 15, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 50px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(241, 196, 15, 0.3);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(24, 165, 88, 0.15);
            border: 1px solid var(--dollar-green);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dollar-light);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--dollar-light);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--dollar-light);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Главный блок */
        .hero {
            text-align: center;
            max-width: 800px;
            margin-bottom: 50px;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h1 span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .highlight-green {
            color: var(--dollar-light);
            font-weight: 700;
        }

        .highlight-gold {
            color: var(--gold);
            font-weight: 700;
        }

        /* Вкладки / Кнопки действия */
        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            margin-bottom: 60px;
        }

        .btn-tab {
            text-decoration: none;
            padding: 20px 35px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-buy {
            background: var(--gold-gradient);
            color: #070d09;
            box-shadow: 0 10px 25px rgba(241, 196, 15, 0.35);
        }

        .btn-buy:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(241, 196, 15, 0.55);
        }

        .btn-reviews {
            background: rgba(24, 165, 88, 0.15);
            color: #ffffff;
            border: 2px solid var(--dollar-green);
            box-shadow: 0 10px 25px rgba(24, 165, 88, 0.2);
        }

        .btn-reviews:hover {
            background: var(--dollar-green);
            color: #070d09;
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(24, 165, 88, 0.45);
        }

        /* Карточки преимуществ */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            width: 10
