<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEBIFIZSHOP — Лучший шоп по продаже физов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070d09;
            --card-bg: rgba(13, 25, 18, 0.84);
            --dollar-green: #18a558;
            --dollar-light: #2ecc71;
            --gold: #f1c40f;
            --gold-gradient: linear-gradient(135deg, #fceabb 0%, #f8b500 50%, #d4af37 100%);
            --text-main: #ffffff;
            --text-muted: #b6cabd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 15% 15%, rgba(24, 165, 88, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(241, 196, 15, 0.14) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1120px;
            width: 100%;
            padding: 30px 20px 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            background: var(--card-bg);
            border: 1px solid rgba(241, 196, 15, 0.28);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            margin-bottom: 42px;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(24, 165, 88, 0.16);
            border: 1px solid var(--dollar-green);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--dollar-light);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--dollar-light);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--dollar-light);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.45); opacity: 0.55; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Центральный верхний блок */
        .center-top {
            width: 100%;
            max-width: 940px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 55px;
        }

        .hero-title {
            font-size: 3.1rem;
            font-weight: 900;
            line-height: 1.15;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hero-title span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-sub {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.65;
            max-width: 780px;
            margin-bottom: 32px;
        }

        .highlight-green {
            color: var(--dollar-light);
            font-weight: 700;
        }

        .highlight-gold {
            color: var(--gold);
            font-weight: 700;
        }

        /* Расширенный мануал по центру сверху */
        .manual-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(241, 196, 15, 0.35);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        .manual-header {
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .manual-intro {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.55;
            max-width: 740px;
            margin: 0 auto 22px;
        }

        .manual-steps {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            text-align: left;
        }

        .step-item {
            background: rgba(7, 13, 9, 0.72);
            border: 1px solid rgba(46, 204, 113, 0.24);
            border-radius: 17px;
            padding: 18px 20px;
            transition: border-color 0.3s cubic-bezier(0.22, 1, 0.36, 1), transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .step-item:hover {
            border-color: rgba(241, 196, 15, 0.55);
            transform: translateY(-2px);
        }

        .step-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .step-num {
            display: inline-block;
            font-size: 0.76rem;
            font-weight: 900;
            color: #070d09;
            background: var(--gold-gradient);
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .step-tag {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--dollar-light);
            background: rgba(24, 165, 88, 0.14);
            border: 1px solid rgba(46, 204, 113, 0.35);
            padding: 3px 9px;
            border-radius: 999px;
        }

        .step-item h4 {
            font-size: 1.02rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 7
